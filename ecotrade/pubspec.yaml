name: ecotrade
description: EcoTrade - Waste Management Marketplace

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # Navigation
  go_router: ^14.0.0

  # Firebase / Auth
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0

  # Data Modeling
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Theming
  flex_color_scheme: ^8.0.0

  # Utilities
  equatable: ^2.0.7
  image_picker: ^1.0.7
  intl: ^0.20.2

  # Push Notifications (FCM)
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^18.0.1

  # Native Splash Screen
  flutter_native_splash: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.6
  riverpod_generator: ^3.0.0
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# ── Native Splash Screen configuration ──────────────────────────────────────
flutter_native_splash:
  # Match the Flutter splash gradient start color
  color: "#0D2B4E"

  # Show the app logo on the native splash
  image: assets/images/ecotade_logo_final.png

  # Android 12+ themed splash (also dark blue)
  color_dark: "#0D2B4E"
  image_dark: assets/images/ecotade_logo_final.png

  android_12:
    color: "#0D2B4E"
    image: assets/images/ecotade_logo_final.png
    color_dark: "#0D2B4E"
    image_dark: assets/images/ecotade_logo_final.png

  web: false

# ── App Launcher Icon configuration ─────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/ecotade_logo_final.png"
  min_sdk_android: 21
  web:
    generate: false
  # Background color for adaptive icon (Android 8+)
  adaptive_icon_background: "#0D2B4E"
  adaptive_icon_foreground: "assets/images/ecotade_logo_final.png"